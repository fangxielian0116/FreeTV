name: Verify DCloud login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: .tools/HBuilderX-5.26
          key: hbuilderx-linux-5.26.2026091802-v1
      - run: bash scripts/ci/setup-hbuilderx.sh
      - run: node scripts/ci/login.mjs
        env:
          DCLOUD_USERNAME: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASSWORD: ${{ secrets.DCLOUD_PASSWORD }}
