name: Android APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: APK target
        type: choice
        options: [both, phone, tv]
        default: both

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BUILD_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate required secrets
        run: node scripts/ci/pack.mjs --validate
        env:
          FREETV_DCLOUD_APPKEY: ${{ secrets.FREETV_DCLOUD_APPKEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android and Gradle build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          mkdir -p .tools
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.14.5-bin.zip --output "$RUNNER_TEMP/gradle-8.14.5-bin.zip"
          echo "6f74b601422d6d6fc4e1f9a1ab6522f642c2fdcbc15ae33ebd30ba3d7198e854  $RUNNER_TEMP/gradle-8.14.5-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-8.14.5-bin.zip" -d .tools
      - name: Download pinned DCloud offline SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdk_archive=dcloud-android-sdk-5.26.82680_20260914-ci.tar.gz
          gh release download build-sdk-5.26.82680-20260914 --repo "$GITHUB_REPOSITORY" --pattern "$sdk_archive" --dir "$RUNNER_TEMP"
          echo "5caa0747dd32b9debe3eb3af37715f81391f15a8f052a3951ef521d6ec9553e0  $RUNNER_TEMP/$sdk_archive" | sha256sum --check
          mkdir -p .tools/DCloud-Android-SDK-5.26
          tar -xzf "$RUNNER_TEMP/$sdk_archive" -C .tools/DCloud-Android-SDK-5.26
      - name: Build signed APK
        run: node scripts/ci/pack.mjs
        env:
          FREETV_DCLOUD_APPKEY: ${{ secrets.FREETV_DCLOUD_APPKEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTV-${{ inputs.target }}-${{ github.run_number }}
          path: |
            artifacts/offline/*/*.apk
            artifacts/offline/*/offline-build-receipt.json
          if-no-files-found: error
          retention-days: 14
